name = "crabtalk-signal"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Needed for packages that use Node.js built-ins (crypto, buffer, etc.)
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "claw.crabtalk.dev"
zone_name = "crabtalk.dev"
custom_domain = true

[[durable_objects.bindings]]
name = "SIGNALING"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_classes = ["SignalingRoom"]

# Set secrets via: wrangler secret put <NAME>
# DATABASE_URL
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# TRUSTED_ORIGINS
# BETTER_AUTH_SECRET
# BETTER_AUTH_URL
