<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrabTalk</title>
  <link rel="icon" type="image/svg+xml" href="assets/CRABTALK.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .hero {
      display: block;
      width: 80px;
      height: 80px;
      margin: 0 auto 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #e8851a;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8b949e;
      text-align: center;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .mode-toggle {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      font-size: 0.875rem;
    }

    .mode-toggle button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      color: #8b949e;
      padding: 0;
      transition: color 0.15s;
    }

    .mode-toggle button.active {
      color: #e8851a;
    }

    .mode-toggle .sep {
      color: #30363d;
      user-select: none;
    }

    .field {
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      padding: 0.625rem 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #e8851a;
      outline: 2px solid rgba(232, 133, 26, 0.3);
      outline-offset: 0;
    }

    input::placeholder {
      color: #8b949e;
    }

    button[type="submit"] {
      width: 100%;
      background: #e8851a;
      border: none;
      border-radius: 6px;
      color: #0d1117;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      margin-top: 0.5rem;
      padding: 0.625rem 0.875rem;
      transition: background 0.15s;
    }

    button[type="submit"]:hover {
      background: #d4760f;
    }

    .error {
      color: #f85149;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1.25rem;
    }

    .success-heading {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1rem;
    }

    .token-block {
      background: #0d1117;
      border: 1px solid #e8851a;
      border-radius: 6px;
      padding: 0.875rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .token-value {
      font-family: 'Courier New', monospace;
      font-size: 0.8125rem;
      color: #e6edf3;
      word-break: break-all;
      padding-right: 4rem;
    }

    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: #30363d;
      border: 1px solid #444c56;
      border-radius: 4px;
      color: #e6edf3;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
      transition: background 0.15s;
    }

    .copy-btn:hover {
      background: #444c56;
    }

    .copy-btn.copied {
      color: #3fb950;
    }

    .success-instruction {
      font-size: 0.875rem;
      color: #8b949e;
      text-align: center;
      line-height: 1.5;
    }

    .success-instruction code {
      font-family: 'Courier New', monospace;
      color: #e8851a;
    }

    .bmc {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8125rem;
    }

    .bmc a {
      color: #8b949e;
      text-decoration: none;
      transition: color 0.15s;
    }

    .bmc a:hover {
      color: #e6edf3;
    }

    .made-by {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.75rem;
    }

    .made-by a {
      color: #484f58;
      text-decoration: none;
      transition: color 0.15s;
    }

    .made-by a:hover {
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="hero" src="assets/CRABTALK.svg" alt="CrabTalk">
    <h1>CrabTalk</h1>
    <p class="subtitle">Authenticate to get a session token for your Claude Code plugin.</p>
    <div class="mode-toggle">
      <button id="btn-login" class="active" type="button">Log In</button>
      <span class="sep">·</span>
      <button id="btn-signup" type="button">Sign Up</button>
    </div>
    <form id="login-form">
      <div class="field" id="field-name" style="display:none">
        <input type="text" name="name" placeholder="Name" autocomplete="name">
      </div>
      <div class="field">
        <input type="email" name="email" placeholder="Email" required autocomplete="email">
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      </div>
      <div class="field" id="field-confirm" style="display:none">
        <input type="password" name="confirm" placeholder="Confirm password" autocomplete="new-password">
      </div>
      <button type="submit" id="submit-btn">Log In</button>
    </form>
    <p class="error" id="error-msg"></p>
    <p class="bmc"><a href="https://buymeacoffee.com/jayub" target="_blank" rel="noopener">☕ Buy me a coffee</a></p>
    <p class="made-by"><a href="https://chkdsklabs.io" target="_blank" rel="noopener">Made by CHKDSK Labs</a></p>
  </div>

  <script>
    // ─── CONFIGURE BEFORE DEPLOY ──────────────────────────────
    const API = 'https://claw.crabtalk.dev';
    // ──────────────────────────────────────────────────────────

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const card = document.getElementById('card');
    const submitBtn = document.getElementById('submit-btn');
    const fieldName = document.getElementById('field-name');
    const fieldConfirm = document.getElementById('field-confirm');

    let mode = 'login';

    document.getElementById('btn-login').addEventListener('click', () => setMode('login'));
    document.getElementById('btn-signup').addEventListener('click', () => setMode('signup'));

    function setMode(next) {
      mode = next;
      errorMsg.textContent = '';
      document.getElementById('btn-login').classList.toggle('active', mode === 'login');
      document.getElementById('btn-signup').classList.toggle('active', mode === 'signup');
      fieldName.style.display = mode === 'signup' ? '' : 'none';
      fieldConfirm.style.display = mode === 'signup' ? '' : 'none';
      fieldName.querySelector('input').required = mode === 'signup';
      fieldConfirm.querySelector('input').required = mode === 'signup';
      submitBtn.textContent = mode === 'login' ? 'Log In' : 'Create Account';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const data = new FormData(e.target);
      const email = data.get('email');
      const password = data.get('password');

      if (mode === 'signup') {
        if (password !== data.get('confirm')) {
          errorMsg.textContent = 'Passwords do not match.';
          return;
        }
      }

      let res, json;
      const endpoint = mode === 'login' ? '/api/auth/sign-in/email' : '/api/auth/sign-up/email';
      const body = mode === 'login'
        ? { email, password }
        : { email, password, name: data.get('name') || email.split('@')[0] };

      try {
        res = await fetch(`${API}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'include',
        });
        json = await res.json();
      } catch {
        errorMsg.textContent = 'Could not reach the signal server. Check your connection.';
        return;
      }

      if (!res.ok || !json.token) {
        errorMsg.textContent = json.message || (mode === 'login' ? 'Login failed. Check your credentials.' : 'Sign up failed.');
        return;
      }

      showSuccess(json.token);
    });

    function showSuccess(token) {
      card.innerHTML = `
        <img class="hero" src="assets/CRABTALK.svg" alt="CrabTalk">
        <h1>CrabTalk</h1>
        <p class="success-heading">Authenticated.</p>
        <div class="token-block">
          <div class="token-value" id="token-value">${token}</div>
          <button class="copy-btn" id="copy-btn">Copy</button>
        </div>
        <p class="success-instruction">Copy this token into your <code>/crabtalk:setup</code> session.</p>
      `;

      document.getElementById('copy-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(token).then(() => {
          const btn = document.getElementById('copy-btn');
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1500);
        });
      });
    }
  </script>
</body>
</html>
