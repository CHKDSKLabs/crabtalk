[package]
name = "crabtalk-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.54", features = ["quic", "noise", "mdns", "request-response", "tokio", "serde", "macros"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
interprocess = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
